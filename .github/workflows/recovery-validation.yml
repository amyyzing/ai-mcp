name: Recovery validation
on:
  push:
    branches: [deobfuscation-readability-v2, luraph-devirtualiser]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and run native, API and recovery gates
        run: docker build --progress=plain -t recovery-validation .
      - name: Verify deployed behavior with owned synthetic fixtures
        if: github.ref == 'refs/heads/luraph-devirtualiser'
        run: python ci/live_smoke.py
