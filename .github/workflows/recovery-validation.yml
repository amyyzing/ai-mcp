name: Recovery validation
on:
  push:
    branches: [deobfuscation-readability-v2, luraph-devirtualiser]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and run native regression gates
        run: docker build --progress=plain -t recovery-validation .
      - name: Export reproducible local test kit
        run: |
          mkdir -p native-kit/bin native-kit/project native-kit/vendor
          id=$(docker create recovery-validation)
          docker cp "$id:/usr/local/bin/luau" native-kit/bin/
          docker cp "$id:/usr/local/bin/luau-compile" native-kit/bin/
          docker cp "$id:/usr/local/bin/luau-ast" native-kit/bin/
          docker cp "$id:/usr/local/bin/lune" native-kit/bin/
          docker cp "$id:/app/." native-kit/project/
          docker cp "$id:/usr/local/lib/python3.12/site-packages/luauvmp" native-kit/vendor/
          docker rm "$id"
          tar -czf native-test-kit.tar.gz native-kit
      - uses: actions/upload-artifact@v4
        with:
          name: native-test-kit
          path: native-test-kit.tar.gz
          retention-days: 3
      - name: Run all packaged tests with test-only dependencies
        run: docker run --rm --user root --entrypoint sh recovery-validation -c 'pip install --no-cache-dir httpx==0.28.1 >/dev/null && python -m unittest discover -s tests -v'
      - name: Inspect native toolchain contracts
        if: always()
        run: |
          chmod +x native-kit/bin/*
          printf '%s' 'local s:string="\104ello"; local function cb() return "\119orld" end; return `{s}`' > /tmp/probe.luau
          native-kit/bin/luau-ast /tmp/probe.luau
          echo
          native-kit/bin/luau-compile --help | head -25
