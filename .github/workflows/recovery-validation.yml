name: Recovery validation
on:
  push:
    branches: [deobfuscation-readability-v2]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    if: github.ref == 'refs/heads/deobfuscation-readability-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deobfuscation-readability-v2
      - name: Retrieve exact reviewed source update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/changes.json.xz
          for sha in d73a1dbe2470d3750c05418f404a23415ee8a68b 914e30025b3fb5706c3cf341166787938a4caac1 5a867f1baa2bab8afa5bbea6fc0d431ab957c637; do
            gh api "repos/amyyzing/ai-mcp/git/blobs/$sha" --jq .content | base64 --decode >> /tmp/changes.json.xz
          done
          echo 'f015b02a43382b86cd12512b8e1017bd68aa33fd1a484c420ae89a86a290592a  /tmp/changes.json.xz' | sha256sum --check --strict
          python - <<'PY'
          import hashlib, json, lzma
          from pathlib import Path
          data=json.loads(lzma.decompress(Path('/tmp/changes.json.xz').read_bytes()))
          allowed={'native_tools.py','readable.py','native_pool.py','recovery_v2.py','recovery.py','engine_runner.py','server.py','Dockerfile','README.md','smoke.py','static/app.js','static/index.html','static/style.css','tests/test_readability.py','tests/test_official_language.py','.github/workflows/recovery-validation.yml','ci/live_smoke.py'}
          assert set(data['files'])==allowed==set(data['sha256'])
          pending={}
          for name,op in data['files'].items():
              if 'content' in op:
                  text=op['content']
              else:
                  text=Path(name).read_text()
                  assert hashlib.sha256(text.encode()).hexdigest()==op['base'], 'Base mismatch: '+name
                  previous=len(text)
                  for start,end,replacement in reversed(op['edits']):
                      assert 0<=start<=end<=previous
                      text=text[:start]+replacement+text[end:]
                      previous=start
              assert hashlib.sha256(text.encode()).hexdigest()==data['sha256'][name], 'Result mismatch: '+name
              pending[name]=text
          for name,text in pending.items():
              path=Path(name);path.parent.mkdir(parents=True,exist_ok=True);path.write_text(text)
          print('Verified exact source hashes for',len(pending),'files; no user submissions included.')
          Path('/tmp/update-manifest.json').write_text(json.dumps(data['sha256'],indent=2))
          PY
      - name: Validate syntax and build all native regression gates
        run: |
          python -m compileall -q *.py tests ci
          node --check static/app.js
          docker build --progress=plain -t recovery-validation .
      - name: Commit tested code only to the isolated test branch
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/deobfuscation-readability-v2
          git restore -- .github/workflows/recovery-validation.yml
          git add native_tools.py readable.py native_pool.py recovery_v2.py recovery.py engine_runner.py server.py Dockerfile README.md smoke.py static/app.js static/index.html static/style.css tests/test_readability.py tests/test_official_language.py ci/live_smoke.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement native static cleanup, closed-pool recovery and truthful output selection'
          git push origin HEAD:refs/heads/deobfuscation-readability-v2
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
